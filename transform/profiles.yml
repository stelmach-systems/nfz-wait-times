# No secrets here. Run dbt from the transform/ directory:  cd transform && uv run dbt debug
# dev  = local DuckDB file shared with the dlt pipeline (../data/nfz.duckdb)
# prod = MotherDuck; the token is read from the MOTHERDUCK_TOKEN environment variable (session 2)
nfz_wait_times:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/nfz.duckdb') }}"
      threads: 4
    prod:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'nfz_wait_times') }}"
      threads: 4
